name = "game-api"
main = "game-api-entry.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "RANKING_DELIVERY"
class_name = "RankingDelivery"

[[migrations]]
tag = "ranking-delivery-v1"
new_sqlite_classes = ["RankingDelivery"]

# Daily 04:30 KST (19:30 UTC): stale unregistered Bubbly Lab runs.
[triggers]
crons = ["30 19 * * *"]

# Optional Turnstile bot defense for Bubbly Lab. Leave unset to keep it off.
#   TURNSTILE_SITE_KEY    (plain var, public)   -> [vars] TURNSTILE_SITE_KEY = "0x4AAAA..."
#   TURNSTILE_SECRET_KEY  (secret)              -> npx wrangler secret put TURNSTILE_SECRET_KEY --config wrangler.game-api.toml
#   WATER_SORT_IP_SALT    (optional secret)     -> salt for the hashed start rate-limit key

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "archerlab_db"
database_id = "babeec1b-1079-4a44-aefe-e1ffaa01f7ff"

# Deployed by Cloudflare Workers Builds (git integration)
