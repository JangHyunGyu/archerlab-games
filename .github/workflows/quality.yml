name: Game quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  games:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game:
          - blockpang
          - cat-tower
          - jelly-pang-2048
          - jewelria
          - lumen-shift
          - parking-escape
          - school-zombie-defense
          - slimevolley
          - solo-leveling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        if: matrix.game == 'school-zombie-defense'
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
        if: matrix.game == 'school-zombie-defense'
      - run: npm run test:game -- --game=${{ matrix.game }}

  shared-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:shared
      - run: npm run assets:check
