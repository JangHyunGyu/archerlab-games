name: Deploy Game API Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - game-api-worker.js
      - wrangler.game-api.toml
      - .github/workflows/deploy-game-api.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: 4.103.0
          command: deploy --config wrangler.game-api.toml
